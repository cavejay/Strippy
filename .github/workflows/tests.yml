name: tests

on:
  push:
  pull_request:

jobs:
  pester:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: pwsh }
          - { os: windows-latest, shell: pwsh }
          - { os: windows-latest, shell: powershell }
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester
        shell: ${{ matrix.shell }}
        run: |
          $PSVersionTable.PSVersion.ToString()
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Install-Module Pester -MinimumVersion 5.3.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = './strippy.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
